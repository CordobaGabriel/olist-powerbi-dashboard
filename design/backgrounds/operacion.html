<!doctype html>
<html lang="es"><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width:1280px; height:720px; overflow:hidden; position:relative;
         background:
           radial-gradient(900px 420px at 92% -12%, #1A2A5A55, transparent 62%),
           radial-gradient(700px 380px at 30% 120%, #12204A40, transparent 60%),
           #0A1128;
         font-family: 'Segoe UI', 'Segoe UI', sans-serif; color:#E6EAF2;
         -webkit-font-smoothing: antialiased; }
  .rail { position:absolute; left:0; top:0; width:200px; height:720px;
           background:#0D1631; border-right:1px solid #1F2B4D; }
  .logo { position:absolute; left:24px; top:24px; width:36px; height:36px;
           background:#F4F6FB; border-radius:9px; padding:4px; }
  .brand { position:absolute; left:72px; top:25px;
            font-size:16px; font-weight:600; letter-spacing:.1px; line-height:1.15; }
  .brand small { display:block; font-size:10.5px; font-weight:400; color:#8A96B3; margin-top:2px; }
  .active { position:absolute; left:12px; top:192px; width:176px; height:40px;
             border-radius:8px; background:#3B78F024; }
  .active::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px;
                     border-radius:0 3px 3px 0; background:#3B78F0; }
  .divider { position:absolute; height:1px; background:#1F2B4D; }
  .note { position:absolute; left:12px; width:176px; text-align:center; font-size:10px; color:#8A96B3;
           line-height:1.4; }
  .note b { color:#B4BDD3; font-weight:600; }
  .title { position:absolute; left:224px; top:22px; }
  .title h1 { font-size:22px; font-weight:600; letter-spacing:-.2px; line-height:1.2; }
  .title p { font-size:12px; color:#8A96B3; margin-top:4px; }
  .panel { position:absolute; background:#111B38; border:1px solid #1F2B4D; border-radius:12px;
            box-shadow: 0 1px 0 #FFFFFF08 inset, 0 10px 30px #00000038; }
  .klabel { position:absolute; left:0; top:14px; text-align:center; font-size:10px; font-weight:600;
             letter-spacing:.9px; text-transform:uppercase; color:#8A96B3;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 10px; }
  /* textos dibujados acá a la escala de Power BI: 1 pt de Power BI = 1,33 px */
  .plabel { position:absolute; left:0; right:0; top:16px; text-align:center; font-size:11px; font-weight:600;
             letter-spacing:.9px; text-transform:uppercase; color:#8A96B3; }
  .pnote { position:absolute; left:0; right:0; bottom:18px; text-align:center; font-size:13.5px; color:#B4BDD3; }
  .ptitle { position:absolute; left:15px; top:13px; font-size:16px; font-weight:600; color:#E6EAF2; }
  .psub { position:absolute; left:15px; top:37px; font-size:12px; color:#8A96B3; }
</style></head><body>
  <div class="rail"></div>
  <img class="logo" src="../assets/olist_logo.png">
  <div class="brand">Olist<small>Tablero de Dirección</small></div>
  <div class="divider" style="left:24px;top:80px;width:152px"></div>
  <div class="active"></div>
  <div class="divider" style="left:24px;top:614px;width:152px"></div>

</body></html>
